# Validate the data, rebuild site/data.js and publish site/ to GitHub Pages
# (https://florian-schager.github.io/atlas/) on every push to main.
# Pull requests only run the validation, so contributions are checked before merging.
name: Validate and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Validate data
        run: python scripts/validate.py

      - name: Build site
        run: python scripts/build_site.py

      - name: Check that the committed site/ is up to date
        run: |
          if ! git diff --quiet -- site/; then
            echo "::warning::site/ differs from a fresh build; run scripts/build_site.py and commit the result."
            git diff --stat -- site/
          fi

      - if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
