<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- A globe, tilted by Earth's 23.4 degrees, whose graticule is a graph: the rim, the equator and the central
       meridian form the wheel W4, properly 3-colored with the site's colors (hub red, poles blue, east and west
       green). -->
  <style>
    .sea { fill: #ece5d6; }
    .rim, .edge { stroke: #3a3935; fill: none; }
    .grid { stroke: #a8a294; fill: none; }
    .halo { stroke: #fbfaf7; }
    .c1 { fill: #b4462a; } .c2 { fill: #2f6aa3; } .c3 { fill: #3f8a4f; }
    @media (prefers-color-scheme: dark) {
      .sea { fill: #2b2a26; }
      .rim, .edge { stroke: #d9d7d0; }
      .grid { stroke: #6b6960; }
      .halo { stroke: #1e1e1b; }
      .c1 { fill: #e57a5c; } .c2 { fill: #6aa6e0; } .c3 { fill: #74c085; }
    }
  </style>
  <circle class="sea" cx="16" cy="16" r="12"/>
  <g transform="rotate(23.4 16 16)">
    <ellipse class="grid" cx="16" cy="16" rx="6.5" ry="12" stroke-width="1.3"/>
    <path class="grid" d="M5.6 10h20.8M5.6 22h20.8" stroke-width="1.3"/>
    <path class="edge" d="M4 16h24M16 4v24" stroke-width="1.8"/>
  </g>
  <circle class="rim" cx="16" cy="16" r="12" stroke-width="2.2"/>
  <g class="halo" stroke-width="1.4" transform="rotate(23.4 16 16)">
    <circle class="c1" cx="16" cy="16" r="3.4"/>
    <circle class="c2" cx="16" cy="4" r="3.2"/>
    <circle class="c2" cx="16" cy="28" r="3.2"/>
    <circle class="c3" cx="4" cy="16" r="3.2"/>
    <circle class="c3" cx="28" cy="16" r="3.2"/>
  </g>
</svg>
